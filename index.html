<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Affairs Command Center 2026 — Framework v3.1</title>
  <meta name="description" content="Kindle E-Book Reader Current Affairs Command Center for Banking, Regulatory, and Civil Services Exams.">
  <link rel="stylesheet" href="styles.css?v=v3.3">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo-group">
        <div class="logo-icon">📖</div>
        <div class="logo-text">
          <h1>Current Affairs Command Center</h1>
          <p>Kindle E-Book Reader Edition | Framework v3.1</p>
        </div>
      </div>
      <div class="header-controls">
        <button id="toggleSidebarBtn" class="toggle-chip">
          🔒 Locked Sections <span id="sidebarChevron">▼</span>
        </button>
        <button id="toggleRecallBtn" class="toggle-chip">
          👁️ Active Recall: OFF
        </button>
      </div>
    </div>
  </header>

  <!-- Collapsible Top Section Navigation Panel -->
  <div id="sectionNavDrawer" class="nav-drawer-panel">
    <div class="nav-drawer-container">
      <div class="nav-drawer-header">
        <span>🔒 11 Locked Sections</span>
        <span class="badge-count" style="background: rgba(0,0,0,0.06); color: var(--text-muted);">Click any section to filter</span>
      </div>
      <ul id="sectionNavList" class="section-nav-grid">
        <!-- Populated dynamically by app.js -->
      </ul>
    </div>
  </div>

  <!-- Centered Main Layout -->
  <main class="main-layout">
    
    <!-- Centered Content Feed Area -->
    <section class="content-area">
      
      <!-- Search & Mode Toolbar -->
      <div class="search-mode-bar">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search headlines, numbers, acts, or static GK...">
        </div>
        <div id="activeCount" class="badge-count" style="font-size: 0.88rem; padding: 6px 12px;">
          <!-- Count updated by app.js -->
        </div>
      </div>

      <!-- Notes Feed -->
      <div id="notesFeed" class="notes-feed">
        <!-- Rendered dynamically by app.js -->
      </div>

      <!-- Section Drill Area (Rendered when specific section is selected) -->
      <div id="drillContainer"></div>

    </section>

  </main>

  <script src="data.js?v=v3.3"></script>
  <script src="app.js?v=v3.3"></script>
</body>
</html>
